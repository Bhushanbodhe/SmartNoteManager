# ========================================
# Server Configuration
# ========================================
server.port=8080

# ========================================
# SQLite Database Configuration
# ========================================
spring.datasource.url=jdbc:sqlite:smartnotes.db?journal_mode=WAL
spring.datasource.driver-class-name=org.sqlite.JDBC

# ========================================
# JPA / Hibernate Configuration
# ========================================
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Disable open-in-view to avoid lazy loading issues
spring.jpa.open-in-view=false

# ========================================
# RAG Configuration (Optional)
# ========================================
# Set to true to enable AI assistant (requires Ollama running)
rag.enabled=false
rag.ollama.base-url=http://localhost:11434
rag.ollama.chat-model=llama3.2
rag.ollama.embedding-model=nomic-embed-text

# ========================================
# Logging
# ========================================
logging.level.com.smartnotes=INFO
logging.level.org.hibernate.SQL=WARN
